# Optional setup/lookup example. Paths are relative to this file.
# Enable only the sources you use. Default lab workflow: pipeline.example.toml.
config_version = 3
[input]
type = "fhir_file"
path = "examples/laboratory.bundle.json"
granularity = "individual"
[specification]
FHIR_VERSION = "4.0.1"
PROFILE = "fhir-r4-lab"
[network]
mode = "lookups"
[output]
mode = "distinct"
path = "output/german-label-review.csv"

[lookups.ucum]
enabled = true
type = "ucum"
endpoint = "https://ucum.nlm.nih.gov/ucum-service/v1"
[lookups.loinc]
enabled = true
type = "loinc"
endpoint = "https://tx.fhir.org/r4"

# Read the linked conditions in docs/lookups.md, then explicitly set both flags.
# LOINC 2.82 translation is pinned to the test server's observed base edition.
# Confirm the returned API edition for your deployment; no automatic 'latest'.
[packages.loinc_de]
enabled = false
registry = "https://terminologien.bfarm.de"
name = "bfarm.terminologien.loinc"
version = "2.82.0"
path = "local/terminologies/loinc-de-2.82.0"
accept_download_conditions = false
# Optional existing token: token_env="BFARM_PACKAGE_TOKEN" or token_file.
[packages.ucum_de]
enabled = false
registry = "https://terminologien.bfarm.de"
name = "bfarm.terminologien.ucum"
version = "1.5.0"
path = "local/terminologies/ucum-de-1.5.0"
accept_download_conditions = false

# Enable these after package-init has installed the corresponding package.
[lookups.loinc_de]
enabled = false
type = "fhir_artifacts"
systems = ["http://loinc.org"]
path = "local/terminologies/loinc-de-2.82.0"
[lookups.ucum_de]
enabled = false
type = "fhir_artifacts"
systems = ["http://unitsofmeasure.org"]
path = "local/terminologies/ucum-de-1.5.0"

# Name search is an explicit external lookup; only terminology labels are sent.
[lookups.semlook]
enabled = false
type = "ols"
endpoint = "https://semanticlookup.zbmed.de/ols/api"
ontology = "loinc"
systems = ["http://loinc.org"]
limit = 5

# Standalone exact ICD-11 MMS stem lookup, not a Condition batch validator.
# 'en' is used here; German 2026-01 is listed by WHO as prerelease.
[lookups.icd11]
enabled = false
type = "who_icd"
systems = ["http://id.who.int/icd/release/11/mms"]
endpoint = "https://id.who.int"
token_endpoint = "https://icdaccessmanagement.who.int/connect/token"
release = "2026-01"
language = "en"
client_id_env = "WHO_ICD_CLIENT_ID"
client_secret_env = "WHO_ICD_CLIENT_SECRET"

# Official BfArM German ATC/DDD edition. Read and accept its conditions yourself.
# Package version 2026.0.0 contains CodeSystem version 2026.
[packages.atc_de]
enabled = false
registry = "https://terminologien.bfarm.de"
name = "bfarm.terminologien.atcgm"
version = "2026.0.0"
path = "local/terminologies/atc-2026"
accept_download_conditions = false

[lookups.atc_de]
enabled = false # Enable after installation; also copy this table into your medication TOML.
role = "primary"
type = "fhir_artifacts"
systems = ["http://fhir.de/CodeSystem/bfarm/atc"]
path = "local/terminologies/atc-2026"

# Download the full LOINC release from loinc.org, then point to its unchanged Loinc.csv.
[lookups.loinc_local]
enabled = false
role = "primary"
type = "loinc_csv"
systems = ["http://loinc.org"]
path = "../input/terminologies/loinc/Loinc.csv"
version = "2.83" # Set the actual downloaded release, not VersionLastChanged.
complete = true # Full edition only; a subset must use false.

[terminology]
strategy = "fallback" # Local first; try enabled compatible APIs until verified. "all" cross-checks all.

[logging]
level = "INFO" # DEBUG, INFO, WARNING or ERROR. The audit is always retained.

[lookups.atc_who]
enabled = true # Public trial; inspect returned edition and coverage.
role = "primary"
type = "fhir"
endpoint = "https://tx.fhir.org/r4"
systems = ["http://www.whocc.no/atc"]

[lookups.snomed]
enabled = true # Public trial; inspect returned edition and coverage.
role = "primary"
type = "fhir"
endpoint = "https://tx.fhir.org/r4"
systems = ["http://snomed.info/sct"]

[lookups.rxnorm]
enabled = true # Public trial; inspect returned edition and coverage.
role = "primary"
type = "fhir"
endpoint = "https://tx.fhir.org/r4"
systems = ["http://www.nlm.nih.gov/research/umls/rxnorm"]

[lookups.unii]
enabled = true # Public trial; inspect returned edition and coverage.
role = "primary"
type = "fhir"
endpoint = "https://tx.fhir.org/r4"
systems = ["http://fdasis.nlm.nih.gov"]

[lookups.edqm]
enabled = true # Public trial; inspect returned edition and coverage.
role = "primary"
type = "fhir"
endpoint = "https://tx.fhir.org/r4"
systems = ["http://standardterms.edqm.eu"]

# Licensed/national catalogues: use actual FHIR JSON or package.tgz files.
# SNOMED RF2 needs import into a terminology server or a licensed CSV/SQLite export.
[lookups.german_medication_files]
enabled = false
role = "primary"
type = "fhir_artifacts"
path = "../input/terminologies/medication"
systems = ["http://fhir.de/CodeSystem/ask", "http://fhir.de/CodeSystem/ifa/pzn", "http://snomed.info/sct", "http://standardterms.edqm.eu", "http://terminology.hl7.org/CodeSystem/CAS"]

# MII SU-TermServ reads require an authorised GEANT client certificate (mTLS).
# These are PEM FILE PATHS, not secret contents or environment variable names.
[lookups.mii_termserv]
enabled = false
role = "primary"
type = "fhir"
endpoint = "https://ontoserver.mii-termserv.de/fhir"
client_cert = "local/secrets/mii-client.crt"
client_key = "local/secrets/mii-client.key"
systems = ["http://loinc.org", "http://snomed.info/sct", "http://fhir.de/CodeSystem/bfarm/atc", "http://fhir.de/CodeSystem/ask", "http://fhir.de/CodeSystem/ifa/pzn", "http://standardterms.edqm.eu"]
