[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "semantic-plausibility"
version = "0.9.2"
description = "Local, auditable semantic reviews of distinct laboratory exports"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]

[project.scripts]
plausibility = "semantic_plausibility.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_plausibility"]

[tool.uv]
default-groups = []
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
    { file = "src/**/*.csv" },
    { file = "src/**/*.html" },
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
