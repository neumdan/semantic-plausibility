[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "semantic-plausibility"
version = "0.14.0"
description = "Local, auditable semantic reviews of laboratory and medication exports"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]

[project.scripts]
plausibility = "semantic_plausibility.cli:main"
run-plausibility-check = "semantic_plausibility.cli:run_main"
research-evidence = "semantic_plausibility.cli:research_main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_plausibility"]

[tool.hatch.build.targets.wheel.force-include]
"catalog.csv" = "semantic_plausibility/catalog.csv"

[tool.uv]
default-groups = []
cache-keys = [
    { file = "pyproject.toml" },
    { file = "catalog.csv" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
    { file = "src/**/*.csv" },
    { file = "src/**/*.html" },
    { file = "src/**/*.Dockerfile" },
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
