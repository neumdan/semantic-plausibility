# Input: illustrative laboratory measurements, not clinical reference evidence.
# Lookups: real public services. Paths are relative to this configuration.
config_version = 3

[general]
PROJECT_NAME = "laboratory-review"
RESOURCE_TYPE = "Observation"

[input]
type = "csv"                         # csv, fhir_file, postgres, sqlite
origin = "lis"
source_namespace = "example-laboratory" # Stable source/site namespace; set yours before collecting reviews.
path = "examples/laboratory-research.csv"      # Your export: local/laboratory.csv
granularity = "distinct"             # count contains the source frequency

[input.columns]
analyte_name = "analyte_name"
method = "method"
code = "code"
code_system = "code_system"
value = "value"
unit = "unit"
unit_code = "unit_code"
unit_system = "unit_system"
count = "count"
reference_ranges_json = "reference_ranges_json"
specimen = "specimen"
source_test = "source_test"
status = "status"

[specification]
FHIR_VERSION = "4.0.1"
PROFILE = "mii-kds-lab"
STRUCTURE_DEFINITION = "examples/profiles/ObservationLab-2026.0.3.json"
VALUE_SETS = ["examples/profiles/results-laboratory-observations-uv-ips.json"]
IG_PACKAGE = "de.medizininformatikinitiative.kerndatensatz.laborbefund"
IG_VERSION = "2026.0.3"
IG_CANONICAL = "https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab"

[network]
mode = "lookups"
allowed_http_hosts = ["ollama", "host.containers.internal", "host.docker.internal"]

[lookups.ucum]
role = "primary"
enabled = true
type = "ucum"
endpoint = "https://ucum.nlm.nih.gov/ucum-service/v1"

[lookups.loinc]
role = "primary"
enabled = true
type = "loinc"
endpoint = "https://tx.fhir.org/r4"   # Public test service; observed release is recorded.
# Official alternative: https://fhir.loinc.org requires these credentials.
# username_env = "LOINC_FHIR_USERNAME"
# password_env = "LOINC_FHIR_PASSWORD"

[lookups.semlook]
role = "optional"
enabled = true
type = "ols"
systems = ["http://loinc.org"]
endpoint = "https://semanticlookup.zbmed.de/ols/api"
ontology = "loinc"
limit = 5

[models.local]
runtime = "ollama"
base_url_env = "LOCAL_MODEL_BASE_URL" # Compose: http://ollama:11434/v1
model = "ministral-3:3b"
temperature = 0
max_tokens = 2048
timeout_seconds = 180
response_mode = "json_schema"

[research]
enabled = true                      # Start Ollama/catalog-init before research-evidence; check stays deterministic
scope = "studies"                   # lookup omits study databases
sources = ["pubmed", "europe_pmc"]
max_articles_per_loinc = 3           # Total unique articles across providers
unit_catalog = "local/unit-catalog.json"
loinc_website_base_url = "https://loinc.org"

[output]
mode = "distinct"                   # items requires individual input and retains IDs.
path = "output/laboratory-research.csv"
# Existing reports are protected; use a new filename or explicitly overwrite=true.
# lookup_pack = "output/lookups.json" # Optional capture of actual service responses.

[research.pubmed]
BASE_URL = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
MAX_RESULTS = 1                     # Per evidence category and LOINC; increase deliberately.
# EMAIL = "your-study-contact@example.org"
# API_KEY_ENV = "PUBMED_API_KEY"      # Optional; credentials in .env.

# Add your REAL site catalogue before interpreting local LIS codes/units.
# No site-specific catalogue is generated by this project.
# [lookups.lis_catalogue]
# enabled = true
# role = "source"
# type = "csv"                    # fhir_artifacts / sqlite / fhir also supported
# path = "local/terminologies/lis-catalogue.csv"
# systems = ["https://your-site.example/lis/tests", "https://your-site.example/lis/units"]
# complete = false                # true only for a complete edition

[quality]
# Create this registry with review-import after checking and clinician review.
# review_registry = "local/clinician-mappings.json"

[research.europe_pmc]
BASE_URL = "https://www.ebi.ac.uk/europepmc/webservices/rest"
MAX_RESULTS = 1
