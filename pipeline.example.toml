# Input: illustrative laboratory measurements, not clinical reference evidence.
# Lookups: real public services. Paths are relative to this configuration.
# Copy to pipeline.toml: the default for Python, Docker Compose and podman-compose.
# Setup: docs/shipped-stack.md. Configuration reference: docs/configuration.md.
config_version = 3

[general]
PROJECT_NAME = "laboratory-review"
RESOURCE_TYPE = "Observation"

[input]
type = "csv"                         # csv, fhir_file, postgres, sqlite
origin = "lis"
source_namespace = "example-laboratory" # Stable source/site namespace; set yours before collecting reviews.
path = "examples/laboratory.csv"      # Your export: local/laboratory.csv
granularity = "distinct"             # count contains the source frequency

[input.columns]
analyte_name = "source_test"          # In this example source_test contains the analyte name.
code = "code"
code_system = "code_system"
value = "value"
unit = "unit"
unit_code = "unit_code"
unit_system = "unit_system"
count = "count"
reference_ranges_json = "reference_ranges_json"
specimen = "specimen"
source_test = "source_test"
status = "status"

[specification]
FHIR_VERSION = "4.0.1"
PROFILE = "mii-kds-lab"
STRUCTURE_DEFINITION = "examples/profiles/ObservationLab-2026.0.3.json"
VALUE_SETS = ["examples/profiles/results-laboratory-observations-uv-ips.json"]
IG_PACKAGE = "de.medizininformatikinitiative.kerndatensatz.laborbefund"
IG_VERSION = "2026.0.3"
IG_CANONICAL = "https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab"

[specification.links]
resource = "https://hl7.org/fhir/R4/observation.html"
guide = "https://www.medizininformatik-initiative.de/Kerndatensatz/KDS_Laborbefund_2026/MIIIGModulLaborbefund.html"
source = "https://github.com/medizininformatik-initiative/kerndatensatzmodul-labor"

[network]
mode = "lookups"
allowed_http_hosts = ["ollama", "host.containers.internal", "host.docker.internal"]

[lookups.ucum]
role = "primary"
enabled = true
type = "ucum"
endpoint = "https://ucum.nlm.nih.gov/ucum-service/v1"

[lookups.loinc]
role = "primary"
enabled = true
type = "loinc"
endpoint = "https://tx.fhir.org/r4"   # Public test service; observed release is recorded.
# Official alternative: https://fhir.loinc.org requires these credentials.
# username_env = "LOINC_FHIR_USERNAME"
# password_env = "LOINC_FHIR_PASSWORD"

[models.local]
container_base_url = "http://ollama:11434/v1" # Compose Ollama; native inference uses base_url(_env) below.
runtime = "ollama"
base_url = "http://127.0.0.1:11434/v1" # Native Ollama; container_base_url is used in Compose.
model = "ministral-3:3b"
temperature = 0
max_tokens = 2048
timeout_seconds = 180
response_mode = "json_schema"

[research]
enabled = false                     # check stays deterministic; research-evidence explicitly enables research
scope = "studies"                   # Override per call with research-evidence --scope lookup|studies
sources = ["europe_pmc", "pubmed"]
max_articles_per_loinc = 3
unit_catalog = "local/unit-catalog.json"
loinc_website_base_url = "https://loinc.org"

[output]
mode = "distinct"                   # items requires individual input and retains IDs.
path = "output/laboratory-review.csv" # Optional per-run override: run-plausibility-check --out output/01-lookup.csv
# Existing reports are protected; use a new filename or explicitly overwrite=true.
# lookup_pack = "output/lookups.json" # Optional capture of actual service responses.

# Add your REAL site catalogue before interpreting local LIS codes/units.
# No site-specific catalogue is generated by this project.
# [lookups.lis_catalogue]
# enabled = true
# role = "source"
# type = "csv"                    # fhir_artifacts / sqlite / fhir also supported
# path = "local/terminologies/lis-catalogue.csv"
# systems = ["https://your-site.example/lis/tests", "https://your-site.example/lis/units"]
# complete = false                # true only for a complete edition

[quality]
# Create this registry with review-import after checking and clinician review.
# review_registry = "local/clinician-mappings.json"

[lookups.bfarm_lab]
# Real BfArM FHIR JSON supplements, installed by the operator.
enabled = false
role = "optional"
type = "fhir_artifacts"
path = "local/terminologies/bfarm-lab"
systems = ["http://loinc.org", "http://unitsofmeasure.org"]

[validation]
# Matchbox uses the official HL7 validator: fhir_file or CSV resource_json input.
# Mode-2 recipe: examples/lab/fhir-csv.toml; scalar tuples remain not_applicable.
enabled = false
backend = "matchbox"
endpoint = "http://127.0.0.1:8081/matchboxv3/fhir"
container_endpoint = "http://matchbox:8080/matchboxv3/fhir"
terminology_server = "http://blaze:8080/fhir"
terminology_endpoint = "http://127.0.0.1:8082/fhir"
timeout_seconds = 180
fail_on_error = true
# additional_packages = [] # Extra real guides use pinned package#version entries.
# token_env = "FHIR_VALIDATOR_TOKEN" # Only for a protected local validator.


[research.europe_pmc]
BASE_URL = "https://www.ebi.ac.uk/europepmc/webservices/rest"
MAX_RESULTS = 1
# Optional public population restriction, recorded in the trace (not an applicability verdict):
# QUERY_FILTER = '(human OR humans OR patients OR volunteers) NOT (feline OR cats OR canine OR dogs OR rats OR mice OR veterinary)'

[research.pubmed]
BASE_URL = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
MAX_RESULTS = 1
# API_KEY_ENV = "PUBMED_API_KEY"      # Optional credential reference, never a literal secret.

[lookups.semlook]
role = "optional"
enabled = true
type = "ols"
systems = ["http://loinc.org"]
endpoint = "https://semanticlookup.zbmed.de/ols/api"
ontology = "loinc"
limit = 5
