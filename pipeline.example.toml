# LABORATORY SETUP: copy once to pipeline.toml and edit that file.
# All commands and Python/Docker/Podman use it by default.
# Choose your LOINC source in section 4; run profile-init once for section 3.
# Source files are illustrative; terminology services are real.
config_version = 3

[catalog]
path = "catalog.csv" # Service/download metadata only; extend this CSV with your sources.

# 1. INPUT — change this block for your CSV, FHIR file or database.
# Left = pipeline field; right = your column. Recipes: examples/lab/README.md.

[general]
PROJECT_NAME = "laboratory-review"
RESOURCE_TYPE = "Observation"

[input]
type = "csv"                         # csv, fhir_file, postgres, sqlite
origin = "lis"
source_namespace = "example-laboratory" # Stable source/site namespace; set yours before collecting reviews.
path = "examples/laboratory.csv"      # Your export: local/laboratory.csv
granularity = "distinct"             # count contains the source frequency

[input.columns]
analyte_name = "analyte_name"          # Explicit source analyte/test label.
code = "code"
code_system = "code_system"
value = "value"
unit = "unit"
unit_code = "unit_code"
unit_system = "unit_system"
count = "count"
reference_low = "reference_low"
reference_high = "reference_high"
reference_unit = "reference_unit"
reference_unit_system = "reference_unit_system"
range_text = "range_text"
specimen = "specimen"
source_test = "source_test"
status = "status"

# 2. OUTPUT — distinct aggregates individual values before evidence research.
# Use a fresh --out filename for each run; mode="items" retains IDs for A1 review.

[output]
mode = "distinct"                   # Aggregate each semantic set before evidence research.
path = "output/laboratory-review.csv" # Optional per-run override: run-plausibility-check --out output/01-lookup.csv

# 3. LABORATORY TARGET — pinned MII profile; optional full-resource validation.

[specification]
FHIR_VERSION = "4.0.1"
PROFILE = "mii-kds-lab"
STRUCTURE_DEFINITION = "local/profiles/ObservationLab-2026.0.3.json"
VALUE_SETS = ["local/profiles/results-laboratory-observations-uv-ips.json"]
# profile-init downloads this exact profile package and selected binding; checks only read local files.
BINDING_URLS = ["https://hl7.org/fhir/uv/ips/ValueSet-results-laboratory-observations-uv-ips.json"]
BINDING_VERSIONS = ["1.1.0"]
IG_PACKAGE = "de.medizininformatikinitiative.kerndatensatz.laborbefund"
IG_VERSION = "2026.0.3"
IG_CANONICAL = "https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab"

[specification.links]
resource = "https://hl7.org/fhir/R4/observation.html"
guide = "https://www.medizininformatik-initiative.de/Kerndatensatz/KDS_Laborbefund_2026/MIIIGModulLaborbefund.html"
source = "https://github.com/medizininformatik-initiative/kerndatensatzmodul-labor"

[validation]
# Enable for complete FHIR resources after following docs/validation.md.
enabled = false
backend = "matchbox"
endpoint = "http://127.0.0.1:8081/matchboxv3/fhir"
container_endpoint = "http://matchbox:8080/matchboxv3/fhir"
terminology_server = "http://blaze:8080/fhir"
terminology_endpoint = "http://127.0.0.1:8082/fhir"
timeout_seconds = 180
fail_on_error = true

# 4. TERMINOLOGY — choose one LOINC route; catalog.csv supplies the defaults.
# A. loinc-api: put LOINC_FHIR_USERNAME and LOINC_FHIR_PASSWORD in .env.
# B. loinc-file: download full Loinc.csv to local/terminologies/loinc/;
#    change source below, add version="2.83" (your edition) and complete=true.
# Optional local server: see docs/lookups.md. BfArM translation files add labels.

[network]
mode = "lookups"
allowed_http_hosts = ["ollama", "ucum", "blaze", "host.containers.internal", "host.docker.internal"]

[terminology]
strategy = "fallback" # Local files first, then enabled APIs; "all" records every configured source.

[lookups.loinc]
enabled = true
role = "primary"
source = "loinc-api"

[lookups.ucum]
enabled = true
role = "primary"
source = "ucum-api" # Or ucum-local after starting the optional ucum container.

[lookups.bfarm_lab]
enabled = false
role = "optional"
source = "bfarm-lab" # Manual downloads under local/terminologies/bfarm-lab/.

# 5. OPTIONAL AI — used by research-evidence, after check.
# --scope lookup: suggestions; --scope studies: suggestions + literature.

[models.local]
container_base_url = "http://ollama:11434/v1" # Compose Ollama; native inference uses base_url(_env) below.
runtime = "ollama"
base_url = "http://127.0.0.1:11434/v1" # Native Ollama; container_base_url is used in Compose.
model = "ministral-3:3b"
temperature = 0
max_tokens = 2048
timeout_seconds = 600 # Allow for CPU inference in a Podman VM.
response_mode = "json_schema"

[research]
enabled = false                     # check stays deterministic; research-evidence explicitly enables research
scope = "studies"                   # Override per call with research-evidence --scope lookup|studies
sources = ["europe_pmc", "pubmed"]
max_articles_per_loinc = 4           # Model extraction budget after relevance screening
unit_catalog = "local/unit-catalog.json"
loinc_website_base_url = "https://loinc.org"

[research.europe_pmc]
BASE_URL = "https://www.ebi.ac.uk/europepmc/webservices/rest"
MAX_RESULTS = 6                     # Candidates per search, screened before model calls
# Explicit hospital-research filter for Europe PMC; recorded, not an applicability verdict.
QUERY_FILTER = '(human OR humans OR patients OR volunteers OR healthy OR population) NOT (feline OR cats OR canine OR dogs OR cattle OR rats OR mice OR veterinary)'

[research.pubmed]
BASE_URL = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
MAX_RESULTS = 3

# RUN LOG — INFO explains phases and counts; DEBUG adds diagnostic detail.

[logging]
level = "INFO" # Override per run with --log-level DEBUG; values and credentials are not console-logged.
