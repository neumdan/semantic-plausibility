name: semantic-plausibility-stack

# Runtime configuration: pipeline.toml. Credentials: .env or local/ secret files.
# One Compose file. Select only the services you need; see README.md.
x-runner: &runner
  image: semantic-plausibility-stack:local
  build:
    context: .
    dockerfile: deploy/Dockerfile
    args: {INSTALL_POSTGRES: "1"}
    labels:
      io.semantic-plausibility.component: runner
      io.semantic-plausibility.build-inputs: ${SQC_RUNNER_BUILD_INPUTS:-manual}
  env_file: .env
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes:
    - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
    - ./examples:/app/examples:ro
    - ./catalog.csv:/app/catalog.csv:ro
    - ${SQC_INPUT_DIR:-../input}:/input:ro
    - ${SQC_LOCAL_DIR:-./local}:/app/local:ro
    - ./output:/app/output
  restart: "no"
  networks: [default, validation]

services:
  run-plausibility-check:
    <<: *runner
    command: ["check", "--config", "/app/pipeline.toml"]
  profile-init:
    <<: *runner
    profiles: [setup]
    command: ["profile-init", "--config", "/app/pipeline.toml"]
    volumes:
      - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
      - ./catalog.csv:/app/catalog.csv:ro
  ucum:
    profiles: [terminology]
    image: semantic-plausibility-ucum:local
    build: ./deploy/ucum
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    ports: ["127.0.0.1:${SQC_UCUM_PORT-8084}:8080"]
    networks: [validation]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  prepare-examples:
    <<: *runner
    profiles: [examples]
    entrypoint: ["python", "/app/tools/prepare-lab-examples.py"]
    command: []
    volumes:
      - ./tools/prepare-lab-examples.py:/app/tools/prepare-lab-examples.py:ro
      - ./examples:/app/examples:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
  research-evidence:
    <<: *runner
    profiles: [research]
    command: ["research-evidence", "--config", "/app/pipeline.toml"]
  review-import:
    <<: *runner
    profiles: [review]
    command: ["review-import", "--help"]
    volumes:
      - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
      - ./examples:/app/examples:ro
      - ${SQC_INPUT_DIR:-../input}:/input:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
      - ./output:/app/output
  model-init:
    <<: *runner
    command: ["model-init", "--config", "/app/pipeline.toml"]
    profiles: [research]
    depends_on:
      ollama: {condition: service_healthy}
  catalog-init:
    <<: *runner
    command: ["catalog-init", "--config", "/app/pipeline.toml"]
    profiles: [research]
    volumes:
      - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
      - ./examples:/app/examples:ro
      - ${SQC_INPUT_DIR:-../input}:/input:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
      - ./output:/app/output
  package-init:
    <<: *runner
    command: ["package-init", "--config", "/app/pipeline.toml"]
    profiles: [terminology]
    volumes:
      - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
      - ./examples:/app/examples:ro
      - ${SQC_INPUT_DIR:-../input}:/input:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
      - ./output:/app/output
  validator-init:
    <<: *runner
    command: ["validator-init", "--config", "/app/pipeline.toml"]
    profiles: [validation, mii-validation, terminology]
    volumes:
      - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
      - ./examples:/app/examples:ro
      - ${SQC_INPUT_DIR:-../input}:/input:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
      - ./output:/app/output
  validate-fhir:
    <<: *runner
    command: ["validate-fhir", "--config", "/app/pipeline.toml"]
    profiles: [validation, mii-validation, terminology]
  terminology-init:
    <<: *runner
    command: ["terminology-init", "--config", "/app/pipeline.toml"]
    profiles: [validation, mii-validation, terminology]
    depends_on:
      blaze: {condition: service_healthy}
    volumes:
      - ./${SQC_CONFIG_FILE:-pipeline.toml}:/app/pipeline.toml:ro
      - ./examples:/app/examples:ro
      - ${SQC_INPUT_DIR:-../input}:/input:ro
      - ${SQC_LOCAL_DIR:-./local}:/app/local
      - ./output:/app/output
  matchbox:
    profiles: [validation]
    image: semantic-plausibility-matchbox:4.1.21
    build:
      context: ${SQC_LOCAL_DIR:-./local}/validation/matchbox
      dockerfile: Dockerfile
      labels:
        io.semantic-plausibility.component: matchbox
        io.semantic-plausibility.build-inputs: ${SQC_MATCHBOX_BUILD_INPUTS:-manual}
    mem_limit: 4g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${SQC_MATCHBOX_PORT-8081}:8080"]
    networks: [validation]
    depends_on:
      blaze: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/matchboxv3/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    restart: unless-stopped
  blaze:
    profiles: [validation, mii-validation, terminology]
    image: docker.io/samply/blaze:1.9.0@sha256:cba859fb460df3938792226f16ba9bde32bf8dd9edeeadffbd818bccdcce56dc
    environment:
      JAVA_TOOL_OPTIONS: -Xmx1200m
      DB_BLOCK_CACHE_SIZE: "128"
      ENABLE_TERMINOLOGY_SERVICE: "true"
      ENABLE_TERMINOLOGY_LOINC: ${SQC_BLAZE_LOINC:-false}
      ENABLE_TERMINOLOGY_SNOMED_CT: "false"
    mem_limit: 2g
    ports: ["127.0.0.1:${SQC_BLAZE_PORT-8082}:8080"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["validation_blaze:/app/data"]
    networks: [validation]
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped
  ollama:
    profiles: [research]
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:0.34.1}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NO_CLOUD: "true"
    volumes: ["ollama_models:/root/.ollama"]
    ports: ["127.0.0.1:${SQC_OLLAMA_PORT-11434}:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  mii-validator:
    profiles: [mii-validation]
    image: ghcr.io/medizininformatik-initiative/mii-fhir-validator:0.0.1-alpha.8
    env_file: local/validation/mii.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    ports: ["127.0.0.1:${SQC_MII_VALIDATOR_PORT:-8083}:8080"]
    volumes:
      - mii_packages:/root/.fhir/packages
      - mii_tx_cache:/tmp/tx-cache
    networks: [validation]
    depends_on:
      blaze: {condition: service_healthy}
    restart: unless-stopped

  example-postgres:
    image: docker.io/library/postgres:17.10-bookworm
    profiles: [laboratory-inputs]
    environment:
      POSTGRES_DB: laboratory
      POSTGRES_USER: ${EXAMPLE_DB_USER:-example}
      POSTGRES_PASSWORD: ${EXAMPLE_DB_PASSWORD:-}
    volumes:
      - lab_example_postgres:/var/lib/postgresql/data
      - ./examples/lab/postgres-init.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
      - ./examples/lab/aggregated.csv:/seed/aggregated.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d laboratory"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks: [default]
    restart: "no"
volumes:
  ollama_models:
    # Share downloaded weights between manual runs and the example script.
    # Set SQC_OLLAMA_VOLUME in .env to reuse an existing named model volume.
    name: ${SQC_OLLAMA_VOLUME:-semantic-plausibility-ollama}
  validation_blaze:

  mii_packages:
  mii_tx_cache:

  lab_example_postgres:

networks:
  default:
  validation:
    internal: true
