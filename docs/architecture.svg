<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc"><title id="title">Architecture: local FHIR validation and laboratory semantic review</title><desc id="desc">Local full FHIR validation, real terminology evidence and auditable clinician proposals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#537487"/></marker></defs><rect width="1200" height="100%" fill="#f4f7f9"/>
<path data-edge="INPUT-VALIDATE" d="M300.0 180 V200.0 H600.0 V220" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="458.0" y="195.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">FHIR</text>
<path data-edge="CONFIG-VALIDATE" d="M900.0 180 V200.0 H600.0 V220" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="758.0" y="195.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">guide</text>
<path data-edge="VALIDATE-GROUP" d="M600.0 345 V365.0 H600.0 V385" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="360.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">attach outcomes</text>
<path data-edge="INPUT-GROUP" d="M40 117 H20 V445 H340" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="458.0" y="277.5" font-family="system-ui,sans-serif" font-size="13" fill="#526978">CSV / DB</text>
<path data-edge="GROUP-CHECK" d="M600.0 510 V530.0 H600.0 V550" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="525.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">sets</text>
<path data-edge="LOCAL-CHECK" d="M360 612.5 L410 622.5" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="393.0" y="612.5" font-family="system-ui,sans-serif" font-size="13" fill="#526978">files</text>
<path data-edge="API-CHECK" d="M840 612.5 L790 622.5" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="823.0" y="612.5" font-family="system-ui,sans-serif" font-size="13" fill="#526978">API</text>
<path data-edge="CHECK-REPORT" d="M600.0 695 V720.0 H600.0 V745" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="715.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">checks + proposals</text>
<path data-edge="REPORT-RESEARCH" d="M600.0 870 V890.0 H300.0 V910" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="458.0" y="885.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">optional evidence pass</text>
<path data-edge="REPORT-REVIEW" d="M600.0 870 V890.0 H900.0 V910" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="758.0" y="885.0" font-family="system-ui,sans-serif" font-size="13" fill="#526978">review</text>
<path data-edge="RESEARCH-REVIEW" d="M560 977.5 L640 977.5" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="972.5" font-family="system-ui,sans-serif" font-size="13" fill="#526978">dossier</text>
<g data-node="INPUT"><rect x="40" y="55" width="520" height="125" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="56" y="84" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Input and source contract</text>
<text x="56" y="108" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">LIS / CSV / DB exports or actual FHIR Bundle / NDJSON</text>
<text x="56" y="129" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Names, code/system/version, value, unit/system</text>
<text x="56" y="150" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">All reference intervals, specimen, method and known counts</text>
</g>
<g data-node="CONFIG"><rect x="640" y="55" width="520" height="125" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="656" y="84" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">One TOML configuration</text>
<text x="656" y="108" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Input/output and columns; pinned MII guide/profile</text>
<text x="656" y="129" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Primary / source / optional terminology services</text>
<text x="656" y="150" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Local model and credentials by environment/file reference</text>
</g>
<g data-node="VALIDATE"><rect x="340" y="220" width="520" height="125" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="356" y="249" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Full FHIR validation when the input is FHIR</text>
<text x="356" y="273" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Local Matchbox + official HL7 validator, or MII validator</text>
<text x="356" y="294" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Pinned guide and dependencies; local Blaze terminology</text>
<text x="356" y="315" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Retain OperationOutcome; unavailable stays unverified</text>
</g>
<g data-node="GROUP"><rect x="340" y="385" width="520" height="125" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="356" y="414" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Standardise and aggregate locally</text>
<text x="356" y="438" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Preserve the complete semantic set and context</text>
<text x="356" y="459" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">DuckDB: distinct sets or items with source IDs</text>
<text x="356" y="480" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Known frequencies: mean/SE and median/IQR</text>
</g>
<g data-node="LOCAL"><rect x="40" y="550" width="320" height="125" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="56" y="579" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Downloaded terminology</text>
<text x="56" y="603" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Real BfArM JSON / source catalogue</text>
<text x="56" y="624" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Versioned labels and exact membership</text>
<text x="56" y="645" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Supplements do not prove conversions</text>
</g>
<g data-node="CHECK"><rect x="410" y="550" width="380" height="145" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="426" y="579" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Laboratory semantic checks</text>
<text x="426" y="603" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Source validity and target profile fit</text>
<text x="426" y="624" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">LOINC axes / UCUM grammar and factors</text>
<text x="426" y="645" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Numeric values and full reference context</text>
<text x="426" y="666" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Explicit transformation proposals</text>
</g>
<g data-node="API"><rect x="840" y="550" width="320" height="125" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="856" y="579" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Configured terminology APIs</text>
<text x="856" y="603" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">NLM UCUM / LOINC / selected services</text>
<text x="856" y="624" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Exact lookups; known versions and coverage</text>
<text x="856" y="645" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Only enabled services are contacted</text>
</g>
<g data-node="REPORT"><rect x="340" y="745" width="520" height="125" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="356" y="774" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Audited check report</text>
<text x="356" y="798" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">CSV / HTML, summary, evidence and hash-chained log</text>
<text x="356" y="819" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Formal FHIR outcomes and semantic findings stay separate</text>
<text x="356" y="840" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Source set → linked terminology → complete proposal</text>
</g>
<g data-node="RESEARCH"><rect x="40" y="910" width="520" height="135" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="56" y="939" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Separate evidence research with local Ollama</text>
<text x="56" y="963" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">LOINC pages + Europe PMC / PubMed abstracts</text>
<text x="56" y="984" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Sourced alternatives, quoted values, units and intervals</text>
<text x="56" y="1005" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Article title / URL / DOI, response hash and retrieval time</text>
<text x="56" y="1026" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Prompts and guarded replies in the research trace</text>
</g>
<g data-node="REVIEW"><rect x="640" y="910" width="520" height="135" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="656" y="939" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Clinician review and future mapping reuse</text>
<text x="656" y="963" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Review semantic correctness and evidence applicability</text>
<text x="656" y="984" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Approve/reject/defer/revoke code, name, unit and factor</text>
<text x="656" y="1005" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Scoped registry rechecks target and transformation</text>
<text x="656" y="1026" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Apply in ETL, then validate the resulting FHIR resources</text>
</g>
</svg>
