<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180" role="img" aria-labelledby="title desc">
<title id="title">Local laboratory export review — architecture</title><desc id="desc">Hospital export boundary; TOML + secrets; Validate and standardise; Embedded DuckDB grouping; Real terminology sources; Shared laboratory check kernel; Optional research module; Other MII quality checks; Local review artifacts; Matched export studies; Laboratory physician review</desc>
