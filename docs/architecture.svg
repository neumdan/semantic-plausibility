<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250" role="img" aria-labelledby="title desc">
<title id="title">Laboratory and medication review architecture</title><desc id="desc">Scalar exports; Complete FHIR exports; One TOML + secrets; 2 · Optional FHIR validation; Standardise and group; Real terminology evidence; 1 · Deterministic check; Optional local model; 3 · Laboratory terminology AI; CSV + HTML review report; 4 · Laboratory AI + studies; Laboratory review registry; Clinician review; Complementary MII checks</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="SCALAR"><rect x="20" y="20" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="49" class="heading">Scalar exports</text>
<text x="36" y="77" class="body" style="font-size:16px">LIS / CDS Hub CSV or DB view</text>
<text x="36" y="102" class="body" style="font-size:16px">Individual rows or distinct sets</text>
<text x="36" y="127" class="body" style="font-size:16px">Explicit columns and real counts</text>
</g>
<g data-node="FHIR"><rect x="385" y="20" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="401" y="49" class="heading">Complete FHIR exports</text>
<text x="401" y="77" class="body" style="font-size:16px">Bundle / resource array / NDJSON</text>
<text x="401" y="102" class="body" style="font-size:16px">or CSV resource_json cells</text>
<text x="401" y="127" class="body" style="font-size:16px">TORCH / CQL selection upstream</text>
</g>
<g data-node="CONFIG"><rect x="750" y="20" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="766" y="49" class="heading">One TOML + secrets</text>
<text x="766" y="77" class="body" style="font-size:16px">Input, profile, real lookups, output</text>
<text x="766" y="102" class="body" style="font-size:16px">Local model and research budgets</text>
<text x="766" y="127" class="body" style="font-size:16px">Credentials in .env / secret files</text>
</g>
<g data-node="VALIDATE"><rect x="385" y="220" width="330" height="132" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="249" class="heading">2 · Optional FHIR validation</text>
<text x="401" y="277" class="body" style="font-size:16px">Full resources → local Matchbox</text>
<text x="401" y="302" class="body" style="font-size:16px">HL7 validator + pinned MII guide</text>
<text x="401" y="327" class="body" style="font-size:16px">Outcome stays separate from fit</text>
</g>
<g data-node="NORMAL"><rect x="385" y="420" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="401" y="449" class="heading">Standardise and group</text>
<text x="401" y="477" class="body" style="font-size:16px">Lab set or complete medication dose</text>
<text x="401" y="502" class="body" style="font-size:16px">DuckDB distinct groups; lab statistics</text>
<text x="401" y="527" class="body" style="font-size:16px">or items with original ID / locator</text>
</g>
<g data-node="SOURCES"><rect x="20" y="620" width="330" height="157" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="649" class="heading">Real terminology evidence</text>
<text x="36" y="677" class="body" style="font-size:16px">Local LOINC / BfArM / ATC + DDD</text>
<text x="36" y="702" class="body" style="font-size:16px">UCUM / LOINC / medication APIs</text>
<text x="36" y="727" class="body" style="font-size:16px">Local first; fallback or all sources</text>
<text x="36" y="752" class="body" style="font-size:16px">Retain editions, hashes, failures</text>
</g>
<g data-node="CHECK"><rect x="385" y="620" width="330" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="649" class="heading">1 · Deterministic check</text>
<text x="401" y="677" class="body" style="font-size:16px">Source identity + target profile rules</text>
<text x="401" y="702" class="body" style="font-size:16px">Code / name / unit fit and numbers</text>
<text x="401" y="727" class="body" style="font-size:16px">Lab ranges / medication dose checks</text>
<text x="401" y="752" class="body" style="font-size:16px">Supported unit transformations</text>
</g>
<g data-node="MODEL"><rect x="750" y="420" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="766" y="449" class="heading">Optional local model</text>
<text x="766" y="477" class="body" style="font-size:16px">Ollama: ministral-3:3b starter</text>
<text x="766" y="502" class="body" style="font-size:16px">or local compatible endpoint</text>
<text x="766" y="527" class="body" style="font-size:16px">Guarded JSON; sources required</text>
</g>
<g data-node="AI"><rect x="750" y="620" width="330" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="766" y="649" class="heading">3 · Laboratory terminology AI</text>
<text x="766" y="677" class="body" style="font-size:16px">Checked report → candidates</text>
<text x="766" y="702" class="body" style="font-size:16px">Real names, codes and unit lists</text>
<text x="766" y="727" class="body" style="font-size:16px">LOINC pages; no study queries</text>
<text x="766" y="752" class="body" style="font-size:16px">Exact rechecks; may abstain</text>
</g>
<g data-node="OUTPUT"><rect x="385" y="850" width="330" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="879" class="heading">CSV + HTML review report</text>
<text x="401" y="907" class="body" style="font-size:16px">Source → linked data → proposal</text>
<text x="401" y="932" class="body" style="font-size:16px">Checks and citations beside each set</text>
<text x="401" y="957" class="body" style="font-size:16px">Summary + evidence + audit hashes</text>
<text x="401" y="982" class="body" style="font-size:16px">Input remains unchanged</text>
</g>
<g data-node="STUDIES"><rect x="750" y="850" width="330" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="766" y="879" class="heading">4 · Laboratory AI + studies</text>
<text x="766" y="907" class="body" style="font-size:16px">Original report → same AI pass</text>
<text x="766" y="932" class="body" style="font-size:16px">Plus Europe PMC / PubMed</text>
<text x="766" y="957" class="body" style="font-size:16px">Quoted reported values and bounds</text>
<text x="766" y="982" class="body" style="font-size:16px">Independent sourced dossier</text>
</g>
<g data-node="REGISTRY"><rect x="20" y="1080" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="1109" class="heading">Laboratory review registry</text>
<text x="36" y="1137" class="body" style="font-size:16px">Approved / rejected / revoked</text>
<text x="36" y="1162" class="body" style="font-size:16px">Source + profile + context scope</text>
<text x="36" y="1187" class="body" style="font-size:16px">Reverify target and factor on reuse</text>
</g>
<g data-node="EXPERT"><rect x="385" y="1080" width="330" height="132" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="1109" class="heading">Clinician review</text>
<text x="401" y="1137" class="body" style="font-size:16px">Decide semantic correctness</text>
<text x="401" y="1162" class="body" style="font-size:16px">Apply approved mappings in ETL</text>
<text x="401" y="1187" class="body" style="font-size:16px">Validate resulting FHIR resources</text>
</g>
<g data-node="MII"><rect x="20" y="850" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="879" class="heading">Complementary MII checks</text>
<text x="36" y="907" class="body" style="font-size:16px">FHIR conformance: validator</text>
<text x="36" y="932" class="body" style="font-size:16px">Availability / completeness: FDE</text>
<text x="36" y="957" class="body" style="font-size:16px">This tool: semantic-set review</text>
</g>
