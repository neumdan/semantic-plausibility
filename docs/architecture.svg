<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="INPUT"><rect x="350" y="20" width="400" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="49" class="heading">Hospital export boundary</text>
<text x="366" y="77" class="body">LIS / FHIR / CDS Hub → files/view</text>
<text x="366" y="102" class="body">TORCH/CQL or SQL selection upstream</text>
<text x="366" y="127" class="body">Explicit input + output selection</text>
</g>
<g data-node="CONFIG"><rect x="20" y="210" width="290" height="157" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="239" class="heading">TOML + secrets</text>
<text x="36" y="267" class="body" style="font-size:16px">Columns / native element mapping</text>
<text x="36" y="292" class="body" style="font-size:16px">Pinned R4 / selected profile rules</text>
<text x="36" y="317" class="body" style="font-size:16px">Grouping + distinct or items mode</text>
<text x="36" y="342" class="body" style="font-size:16px">Explicit local or remote sources</text>
</g>
<g data-node="NORMAL"><rect x="350" y="210" width="400" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="239" class="heading">Validate and standardise</text>
<text x="366" y="267" class="body">Codes + units + values + references</text>
<text x="366" y="292" class="body">Preserve versions/context; no rewrite</text>
</g>
<g data-node="GROUP"><rect x="350" y="380" width="400" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="409" class="heading">Embedded DuckDB grouping</text>
<text x="366" y="437" class="body">Distinct: complete guarded sets</text>
<text x="366" y="462" class="body">Known counts → mean/SE, median/IQR</text>
<text x="366" y="487" class="body">Items: retain ID / component path</text>
</g>
<g data-node="REF"><rect x="20" y="580" width="290" height="207" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="609" class="heading">Real terminology sources</text>
<text x="36" y="637" class="body" style="font-size:16px">NLM UCUM + LOINC API</text>
<text x="36" y="662" class="body" style="font-size:16px">Pinned BfArM / FHIR packages</text>
<text x="36" y="687" class="body" style="font-size:16px">Base codes / label supplements</text>
<text x="36" y="712" class="body" style="font-size:16px">SemLookP names: opt-in candidates</text>
<text x="36" y="737" class="body" style="font-size:16px">Site CSV / SQLite catalogues</text>
<text x="36" y="762" class="body" style="font-size:16px">Real evidence; missing → unknown</text>
</g>
<g data-node="CHECK"><rect x="350" y="580" width="400" height="157" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="609" class="heading">Shared laboratory check kernel</text>
<text x="366" y="637" class="body">Exact lookup → aliases → fit → bounds</text>
<text x="366" y="662" class="body">Transformations need verified factors</text>
<text x="366" y="687" class="body">Unknown evidence stays unknown</text>
<text x="366" y="712" class="body">Every partial finding stays visible</text>
</g>
<g data-node="RESEARCH"><rect x="790" y="580" width="290" height="182" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="806" y="609" class="heading">Optional research module</text>
<text x="806" y="637" class="body" style="font-size:16px">Local model only</text>
<text x="806" y="662" class="body" style="font-size:16px">Catalogue spelling candidates</text>
<text x="806" y="687" class="body" style="font-size:16px">Quoted terminology pages</text>
<text x="806" y="712" class="body" style="font-size:16px">Bounded PubMed abstracts</text>
<text x="806" y="737" class="body" style="font-size:16px">Expert applicability required</text>
</g>
<g data-node="QC"><rect x="20" y="835" width="290" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="864" class="heading">Other MII quality checks</text>
<text x="36" y="892" class="body" style="font-size:16px">FHIR Validator: conformance</text>
<text x="36" y="917" class="body" style="font-size:16px">FDE: availability/completeness</text>
<text x="36" y="942" class="body" style="font-size:16px">Separate scopes and outputs</text>
</g>
<g data-node="OUTPUT"><rect x="350" y="835" width="400" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="366" y="864" class="heading">Local review artifacts</text>
<text x="366" y="892" class="body">CSV + HTML + summary + evidence</text>
<text x="366" y="917" class="body">Terminology credibility / readiness</text>
<text x="366" y="942" class="body">Suggested mapping / transformation</text>
<text x="366" y="967" class="body">Chained log + hashes + versions</text>
</g>
<g data-node="STUDY"><rect x="790" y="835" width="290" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="806" y="864" class="heading">Matched export studies</text>
<text x="806" y="892" class="body" style="font-size:16px">LIS ↔ FHIR ↔ CDS Hub</text>
<text x="806" y="917" class="body" style="font-size:16px">Groups + known frequencies</text>
<text x="806" y="942" class="body" style="font-size:16px">Context changes / loss candidates</text>
</g>
<g data-node="EXPERT"><rect x="350" y="1060" width="400" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="366" y="1089" class="heading">Laboratory physician review</text>
<text x="366" y="1117" class="body">Approve proposals in a separate copy</text>
<text x="366" y="1142" class="body">Apply/revalidate in the site ETL</text>
</g>
