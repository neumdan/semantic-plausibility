<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1300" viewBox="0 0 1100 1300" role="img" aria-labelledby="title desc">
<title id="title">Local files or APIs — laboratory review architecture</title><desc id="desc">Hospital export boundary; TOML + secret references; Validate and standardise; Embedded DuckDB grouping; A · Local terminology; B · API configuration; Same laboratory check kernel; Optional candidate evidence; Other MII quality checks; Local review artifacts; Matched export studies; Laboratory physician review</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="INPUT"><rect x="350" y="20" width="400" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="49" class="heading">Hospital export boundary</text>
<text x="366" y="77" class="body">LIS / FHIR / CDS Hub → files/view</text>
<text x="366" y="102" class="body">TORCH/CQL or SQL selection upstream</text>
<text x="366" y="127" class="body">Explicit input + output selection</text>
</g>
<g data-node="CONFIG"><rect x="20" y="210" width="290" height="157" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="239" class="heading">TOML + secret references</text>
<text x="36" y="267" class="body" style="font-size:16px">Map input / selected profile rules</text>
<text x="36" y="292" class="body" style="font-size:16px">Choose local, API or both</text>
<text x="36" y="317" class="body" style="font-size:16px">Enable sources; select editions</text>
<text x="36" y="342" class="body" style="font-size:16px">Offline mode disables API calls</text>
</g>
<g data-node="NORMAL"><rect x="350" y="210" width="400" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="239" class="heading">Validate and standardise</text>
<text x="366" y="267" class="body">Codes + units + values + references</text>
<text x="366" y="292" class="body">Preserve versions/context; no rewrite</text>
</g>
<g data-node="GROUP"><rect x="350" y="380" width="400" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="409" class="heading">Embedded DuckDB grouping</text>
<text x="366" y="437" class="body">Distinct: complete guarded sets</text>
<text x="366" y="462" class="body">Known counts → mean/SE, median/IQR</text>
<text x="366" y="487" class="body">Items: retain ID / component path</text>
</g>
<g data-node="LOCAL"><rect x="20" y="480" width="290" height="182" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="509" class="heading">A · Local terminology</text>
<text x="36" y="537" class="body" style="font-size:16px">Download once with package-init</text>
<text x="36" y="562" class="body" style="font-size:16px">or install real JSON/CSV/SQLite</text>
<text x="36" y="587" class="body" style="font-size:16px">Set lookup.path + systems</text>
<text x="36" y="612" class="body" style="font-size:16px">Offline: add UCUM/LOINC pack</text>
<text x="36" y="637" class="body" style="font-size:16px">Keep editions and file hashes</text>
</g>
<g data-node="API"><rect x="790" y="380" width="290" height="182" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="806" y="409" class="heading">B · API configuration</text>
<text x="806" y="437" class="body" style="font-size:16px">Set type, endpoint + systems</text>
<text x="806" y="462" class="body" style="font-size:16px">Credentials: .env / secret files</text>
<text x="806" y="487" class="body" style="font-size:16px">NLM / LOINC / own FHIR</text>
<text x="806" y="512" class="body" style="font-size:16px">network.mode = lookups</text>
<text x="806" y="537" class="body" style="font-size:16px">Enabled APIs called at runtime</text>
</g>
<g data-node="CHECK"><rect x="350" y="680" width="400" height="182" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="366" y="709" class="heading">Same laboratory check kernel</text>
<text x="366" y="737" class="body">Exact code/system + alias checks</text>
<text x="366" y="762" class="body">UCUM syntax / LOINC unit examples</text>
<text x="366" y="787" class="body">Transformations: verified factors only</text>
<text x="366" y="812" class="body">Values / references / context</text>
<text x="366" y="837" class="body">Missing evidence → unverified</text>
</g>
<g data-node="RESEARCH"><rect x="790" y="680" width="290" height="182" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="806" y="709" class="heading">Optional candidate evidence</text>
<text x="806" y="737" class="body" style="font-size:16px">Local model for extraction</text>
<text x="806" y="762" class="body" style="font-size:16px">SemLookP name candidates</text>
<text x="806" y="787" class="body" style="font-size:16px">Quoted terminology pages</text>
<text x="806" y="812" class="body" style="font-size:16px">Bounded PubMed abstracts</text>
<text x="806" y="837" class="body" style="font-size:16px">Expert applicability required</text>
</g>
<g data-node="QC"><rect x="20" y="935" width="290" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="964" class="heading">Other MII quality checks</text>
<text x="36" y="992" class="body" style="font-size:16px">FHIR Validator: conformance</text>
<text x="36" y="1017" class="body" style="font-size:16px">FDE: availability/completeness</text>
<text x="36" y="1042" class="body" style="font-size:16px">Separate scopes and outputs</text>
</g>
<g data-node="OUTPUT"><rect x="350" y="935" width="400" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="366" y="964" class="heading">Local review artifacts</text>
<text x="366" y="992" class="body">CSV + HTML + summary + evidence</text>
<text x="366" y="1017" class="body">Terminology credibility / readiness</text>
<text x="366" y="1042" class="body">Suggested mapping / transformation</text>
<text x="366" y="1067" class="body">Chained log + hashes + editions</text>
</g>
<g data-node="STUDY"><rect x="790" y="935" width="290" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="806" y="964" class="heading">Matched export studies</text>
<text x="806" y="992" class="body" style="font-size:16px">LIS ↔ FHIR ↔ CDS Hub</text>
<text x="806" y="1017" class="body" style="font-size:16px">Groups + known frequencies</text>
<text x="806" y="1042" class="body" style="font-size:16px">Context changes / loss candidates</text>
</g>
<g data-node="EXPERT"><rect x="350" y="1160" width="400" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="366" y="1189" class="heading">Laboratory physician review</text>
<text x="366" y="1217" class="body">Approve proposals in a separate copy</text>
<text x="366" y="1242" class="body">Apply/revalidate in the site ETL</text>
</g>
