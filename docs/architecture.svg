<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1190" viewBox="0 0 1100 1190" role="img" aria-labelledby="title desc">
<title id="title">Laboratory architecture: local processing and explicit source requests</title><desc id="desc">Selected laboratory input; One pipeline.toml + catalog.csv; lookup: Python + embedded DuckDB; Terminology evidence; Optional fhir-validation; Optional local Laya; lookup: audited CSV + HTML; Ollama / own local API; ai-lookup / ai-evidence: Python research; Selected source APIs / pages; CSV + HTML: clinical review</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="INPUT"><rect x="20" y="20" width="510" height="125" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="49" class="heading">Selected laboratory input</text>
<text x="36" y="77" class="body">CSV / FHIR export / read-only SQLite or PostgreSQL</text>
<text x="36" y="102" class="body">TORCH / CQL selects server exports upstream</text>
<text x="36" y="127" class="body">Mapped columns or native FHIR fields</text>
</g>
<g data-node="CONFIG"><rect x="570" y="20" width="510" height="125" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="586" y="49" class="heading">One pipeline.toml + catalog.csv</text>
<text x="586" y="77" class="body">Mapping, grouping, profile, sources and model</text>
<text x="586" y="102" class="body">Downloaded profiles / terminology under local/</text>
<text x="586" y="127" class="body">Credentials in .env or secret files</text>
</g>
<g data-node="LOOKUP"><rect x="20" y="215" width="650" height="140" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="36" y="244" class="heading">lookup: Python + embedded DuckDB</text>
<text x="36" y="272" class="body">Preflight → optional validation → normalize → group → check</text>
<text x="36" y="297" class="body">Preserve code / system, name, specimen, values and units</text>
<text x="36" y="322" class="body">Check reference context and cross-field consistency</text>
</g>
<g data-node="TX"><rect x="740" y="215" width="340" height="140" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="756" y="244" class="heading">Terminology evidence</text>
<text x="756" y="272" class="body" style="font-size:16px">Files + APIs: fallback or all</text>
<text x="756" y="297" class="body" style="font-size:16px">Optional Blaze: imported content</text>
<text x="756" y="322" class="body" style="font-size:16px">UCUM: NLM API OR local service</text>
</g>
<g data-node="VALIDATE"><rect x="20" y="420" width="650" height="115" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="449" class="heading">Optional fhir-validation</text>
<text x="36" y="477" class="body">Complete file / FHIR-in-CSV → Matchbox / HL7</text>
<text x="36" y="502" class="body">Pinned guide + local Blaze terminology; separate outcomes</text>
</g>
<g data-node="LAYA"><rect x="740" y="420" width="340" height="110" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="756" y="449" class="heading">Optional local Laya</text>
<text x="756" y="477" class="body" style="font-size:16px">Advisory domain / next step</text>
<text x="756" y="502" class="body" style="font-size:16px">Configured source is retained</text>
</g>
<g data-node="R1"><rect x="20" y="600" width="650" height="110" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="36" y="629" class="heading">lookup: audited CSV + HTML</text>
<text x="36" y="657" class="body">Field decisions + five laboratory assessment scopes</text>
<text x="36" y="682" class="body">Evidence JSONL + summary + hash-chained audit</text>
</g>
<g data-node="MODEL"><rect x="740" y="615" width="340" height="110" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="756" y="644" class="heading">Ollama / own local API</text>
<text x="756" y="672" class="body" style="font-size:16px">Candidate selection + extraction</text>
<text x="756" y="697" class="body" style="font-size:16px">Bounded texts; retained weights</text>
</g>
<g data-node="RESEARCH"><rect x="20" y="790" width="650" height="140" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="36" y="819" class="heading">ai-lookup / ai-evidence: Python research</text>
<text x="36" y="847" class="body">Read grouped lookup report and its verified sidecars</text>
<text x="36" y="872" class="body">Text/tables → parser or local model → source guards</text>
<text x="36" y="897" class="body">ai-evidence includes AI lookup plus study extraction</text>
</g>
<g data-node="WEB"><rect x="740" y="800" width="340" height="140" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="756" y="829" class="heading">Selected source APIs / pages</text>
<text x="756" y="857" class="body" style="font-size:16px">ai-lookup: terminology / pages</text>
<text x="756" y="882" class="body" style="font-size:16px">ai-evidence: literature APIs</text>
<text x="756" y="907" class="body" style="font-size:16px">Python retrieves source text</text>
</g>
<g data-node="OUT"><rect x="20" y="1020" width="1060" height="115" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="36" y="1049" class="heading">CSV + HTML: clinical review</text>
<text x="36" y="1077" class="body">Field → finding / condition → recommendation + why → sources</text>
<text x="36" y="1102" class="body">Clinician approval → local registry; recheck targets and factors on later lookup runs</text>
</g>
