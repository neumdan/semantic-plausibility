<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1680" viewBox="0 0 1100 1680" role="img" aria-labelledby="title desc">
<title id="title">Check the source set, select evidence scope, review the proposal</title><desc id="desc">1. Check input contract; 2. Formal validation requested?; 3. Verify the declared code/system and unit/system using configured sources; Confirmed invalid; Verified identity / syntax; Unverified / unavailable; 4. Assess unit fit and transformation; 5. Check quantities and context; write the checked CSV; Modes 1 / 2: lab or medication; Lab mode 3: scope=lookup; Lab mode 4: scope=studies; 6. Review the whole proposal with its evidence; 7. Optional laboratory mapping reuse</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="CONTRACT"><rect x="130" y="20" width="840" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="49" class="heading">1. Check input contract</text>
<text x="146" y="77" class="body">Observation / MedicationRequest / MedicationAdministration; explicit source mapping</text>
<text x="146" y="102" class="body">Malformed input fails; preserve every reference interval or dosage instruction</text>
</g>
<g data-node="VALIDATION"><rect x="130" y="185" width="840" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="214" class="heading">2. Formal validation requested?</text>
<text x="146" y="242" class="body">Full FHIR file or CSV resource_json → local Matchbox/HL7 + pinned guide</text>
<text x="146" y="267" class="body">Scalar sets → not_applicable; unavailable/invalid validation remains explicit</text>
</g>
<g data-node="LOOKUP"><rect x="130" y="350" width="840" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="379" class="heading">3. Verify the declared code/system and unit/system using configured sources</text>
<text x="146" y="407" class="body">Local real catalogue and/or enabled API; preserve edition and source</text>
<text x="146" y="432" class="body">Lab: selected profile rules + LOINC axes; medication: supplied coding and dose context</text>
</g>
<g data-node="INVALID"><rect x="20" y="515" width="330" height="106" rx="9" fill="#fcf1f3" stroke="#ecc7cf"/>
<text x="36" y="544" class="heading">Confirmed invalid</text>
<text x="36" y="572" class="body" style="font-size:16px">Record deterministic error</text>
<text x="36" y="597" class="body" style="font-size:16px">Continue other independent checks</text>
</g>
<g data-node="VERIFIED"><rect x="385" y="515" width="330" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="544" class="heading">Verified identity / syntax</text>
<text x="401" y="572" class="body" style="font-size:16px">Check code-unit-context fit</text>
<text x="401" y="597" class="body" style="font-size:16px">Membership alone is insufficient</text>
</g>
<g data-node="UNKNOWN"><rect x="750" y="515" width="330" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="766" y="544" class="heading">Unverified / unavailable</text>
<text x="766" y="572" class="body" style="font-size:16px">Keep evidence gap visible</text>
<text x="766" y="597" class="body" style="font-size:16px">Do not call absence invalid</text>
</g>
<g data-node="FIT"><rect x="130" y="685" width="840" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="714" class="heading">4. Assess unit fit and transformation</text>
<text x="146" y="742" class="body">Lab: documented code–unit fit; verified conversion → factor for value and bounds</text>
<text x="146" y="767" class="body">Medication: dose × source strength → conditional conversion with sources and factor</text>
<text x="146" y="792" class="body">Missing evidence / ambiguous strength or count units → expert review, no forced map</text>
</g>
<g data-node="NUMERIC"><rect x="130" y="880" width="840" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="909" class="heading">5. Check quantities and context; write the checked CSV</text>
<text x="146" y="937" class="body">Lab: numeric values and reference bounds; medication: dose, timing, range and units</text>
<text x="146" y="962" class="body">Infusion rate × duration is conditional unless constant uninterrupted delivery is asserted</text>
</g>
<g data-node="NO_AI"><rect x="20" y="1050" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="1079" class="heading">Modes 1 / 2: lab or medication</text>
<text x="36" y="1107" class="body" style="font-size:16px">Deterministic findings + sources</text>
<text x="36" y="1132" class="body" style="font-size:16px">Optional full FHIR outcome</text>
<text x="36" y="1157" class="body" style="font-size:16px">No model calls</text>
</g>
<g data-node="AI"><rect x="385" y="1050" width="330" height="132" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="1079" class="heading">Lab mode 3: scope=lookup</text>
<text x="401" y="1107" class="body" style="font-size:16px">Local AI suggests code/name/unit</text>
<text x="401" y="1132" class="body" style="font-size:16px">Real candidate retrieval + recheck</text>
<text x="401" y="1157" class="body" style="font-size:16px">No literature retrieval</text>
</g>
<g data-node="EVIDENCE"><rect x="750" y="1050" width="330" height="132" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="766" y="1079" class="heading">Lab mode 4: scope=studies</text>
<text x="766" y="1107" class="body" style="font-size:16px">Same AI + configured study APIs</text>
<text x="766" y="1132" class="body" style="font-size:16px">Quote values / units / intervals</text>
<text x="766" y="1157" class="body" style="font-size:16px">Keep gaps and failures visible</text>
</g>
<g data-node="REVIEW"><rect x="130" y="1255" width="840" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="1284" class="heading">6. Review the whole proposal with its evidence</text>
<text x="146" y="1312" class="body">Original set → linked code/analyte/name/units → proposal with transformations</text>
<text x="146" y="1337" class="body">Physician records decision, reviewer, time and rationale; source remains unchanged</text>
<text x="146" y="1362" class="body">Numeric readiness, FHIR conformance and clinical correctness stay distinct</text>
</g>
<g data-node="REUSE"><rect x="130" y="1460" width="840" height="157" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="1489" class="heading">7. Optional laboratory mapping reuse</text>
<text x="146" y="1517" class="body">Import clinician decisions; recheck target code, unit, factor and reference bounds</text>
<text x="146" y="1542" class="body">Source, catalogue, profile or context changes require renewed review</text>
<text x="146" y="1567" class="body">Apply approved transformations in institutional ETL and validate the resulting FHIR</text>
<text x="146" y="1592" class="body">No automated resource rewrite or model retraining</text>
</g>
<path data-edge="CONTRACT-VALIDATION" d="M550 126 V182" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="VALIDATION-LOOKUP" d="M550 291 V347" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="LOOKUP-INVALID" d="M550 456 V485 H185 V512" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="LOOKUP-VERIFIED" d="M550 456 V512" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="LOOKUP-UNKNOWN" d="M550 456 V485 H915 V512" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="INVALID-FIT" d="M185 621 V650 H450 V682" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="VERIFIED-FIT" d="M550 621 V682" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="UNKNOWN-FIT" d="M915 621 V650 H650 V682" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FIT-NUMERIC" d="M550 817 V877" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="NUMERIC-NO_AI" d="M550 986 V1018 H185 V1047" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="NUMERIC-AI" d="M550 986 V1047" fill="none" stroke="#537487" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path data-edge="NUMERIC-EVIDENCE" d="M550 986 V1018 H915 V1047" fill="none" stroke="#537487" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path data-edge="NO_AI-REVIEW" d="M185 1182 V1220 H450 V1252" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="AI-REVIEW" d="M550 1182 V1252" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="EVIDENCE-REVIEW" d="M915 1182 V1220 H650 V1252" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="REVIEW-REUSE" d="M550 1387 V1457" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
