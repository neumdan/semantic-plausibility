<path data-edge="KNOWN-FIT" d="M550 426 V482" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="UNKNOWN-FIT" d="M915 426 V455 H550 V482" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FIT-MATCH" d="M550 567 V595 H185 V617" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FIT-CONVERT" d="M550 567 V617" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FIT-AMBIG" d="M550 567 V595 H915 V617" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="MATCH-RESEARCH" d="M185 752 V785 H550 V812" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="CONVERT-RESEARCH" d="M550 752 V812" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="AMBIG-RESEARCH" d="M915 752 V785 H550 V812" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="RESEARCH-NUMERIC" d="M550 921 V977" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="NUMERIC-OUTPUT" d="M550 1112 V1172" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="OUTPUT-REVIEW" d="M550 1281 V1337" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
