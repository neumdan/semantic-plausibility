<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1850" viewBox="0 0 1100 1850" role="img" aria-labelledby="title desc">
<title id="title">Configured local or API evidence → laboratory decisions</title><desc id="desc">Input contract + selected profile; Select configured evidence per lookup: A, B or both; A · Ready local terminology files; B · Configured API and credentials; Validate declared code/system and unit/system; Confirmed invalid; Verified code / unit; Not verified; Check supplied aliases, LOINC axes / example units and context; Documented unchanged fit; Verified linear conversion; Ambiguous / mismatch; Explicit candidate sources and optional local research; Values and reference metadata; Write separate checks, credibility and explicit readiness denominators; Expert adjudication → approved site mapping → formal FHIR validation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="INPUT"><rect x="130" y="20" width="840" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="49" class="heading">Input contract + selected profile</text>
<text x="146" y="77" class="body">Valid headers/types, frequency contract, versions, full reference/context guards</text>
<text x="146" y="102" class="body">Unsupported/malformed contracts fail with a redacted audit; valid rows continue</text>
</g>
<g data-node="SOURCE"><rect x="130" y="185" width="840" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="214" class="heading">Select configured evidence per lookup: A, B or both</text>
<text x="146" y="242" class="body">A: previously installed files / captured pack · B: enabled API and credentials</text>
<text x="146" y="267" class="body">Offline mode disables remote adapters; no fallback to an unconfigured API</text>
</g>
<g data-node="LOCAL"><rect x="20" y="345" width="500" height="157" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="374" class="heading">A · Ready local terminology files</text>
<text x="36" y="402" class="body">package-init is a separate setup command</text>
<text x="36" y="427" class="body">Accept conditions and pin editions before download</text>
<text x="36" y="452" class="body">Reference lookup.path / systems; input.snapshot for pack</text>
<text x="36" y="477" class="body">Supplements provide labels; coverage stays explicit</text>
</g>
<g data-node="API"><rect x="580" y="345" width="500" height="157" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="596" y="374" class="heading">B · Configured API and credentials</text>
<text x="596" y="402" class="body">Set type, endpoint and systems where required</text>
<text x="596" y="427" class="body">Use .env / secret-file references; select release/language</text>
<text x="596" y="452" class="body">Require network.mode=lookups and lookup.enabled=true</text>
<text x="596" y="477" class="body">Public services may need no credentials</text>
</g>
<g data-node="LOOKUP"><rect x="130" y="565" width="840" height="82" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="594" class="heading">Validate declared code/system and unit/system</text>
<text x="146" y="622" class="body">Read local evidence and/or query selected services; retain source and edition</text>
</g>
<g data-node="INVALID"><rect x="20" y="700" width="330" height="106" rx="9" fill="#fcf1f3" stroke="#ecc7cf"/>
<text x="36" y="729" class="heading">Confirmed invalid</text>
<text x="36" y="757" class="body">Keep deterministic error</text>
<text x="36" y="782" class="body">Assess remaining fields</text>
</g>
<g data-node="KNOWN"><rect x="385" y="700" width="330" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="401" y="729" class="heading">Verified code / unit</text>
<text x="401" y="757" class="body">Identity or syntax supported</text>
<text x="401" y="782" class="body">Still check semantic fit</text>
</g>
<g data-node="UNKNOWN"><rect x="750" y="700" width="330" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="766" y="729" class="heading">Not verified</text>
<text x="766" y="757" class="body">Absent / partial / unavailable</text>
<text x="766" y="782" class="body">Unavailable is not invalid</text>
</g>
<g data-node="FIT"><rect x="130" y="865" width="840" height="82" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="894" class="heading">Check supplied aliases, LOINC axes / example units and context</text>
<text x="146" y="922" class="body">Names and unit syntax alone cannot prove fit; examples are not a universal whitelist</text>
</g>
<g data-node="MATCH"><rect x="20" y="1000" width="330" height="132" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="36" y="1029" class="heading">Documented unchanged fit</text>
<text x="36" y="1057" class="body">Continue to values/references</text>
<text x="36" y="1082" class="body">Clinical applicability remains</text>
<text x="36" y="1107" class="body">a separate review question</text>
</g>
<g data-node="CONVERT"><rect x="385" y="1000" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="401" y="1029" class="heading">Verified linear conversion</text>
<text x="401" y="1057" class="body">Propose target + numeric factor</text>
<text x="401" y="1082" class="body">Check each reference bound too</text>
<text x="401" y="1107" class="body">Never rewrite source values</text>
</g>
<g data-node="AMBIG"><rect x="750" y="1000" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="766" y="1029" class="heading">Ambiguous / mismatch</text>
<text x="766" y="1057" class="body">10*6 without a denominator</text>
<text x="766" y="1082" class="body">First example is a candidate</text>
<text x="766" y="1107" class="body">No guessed transformation</text>
</g>
<g data-node="RESEARCH"><rect x="130" y="1195" width="840" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="1224" class="heading">Explicit candidate sources and optional local research</text>
<text x="146" y="1252" class="body">SemLookP names; catalogue → local model → quoted lookup pages → PubMed candidates</text>
<text x="146" y="1277" class="body">Candidate searches are opt-in; offline mode has no remote research</text>
</g>
<g data-node="NUMERIC"><rect x="130" y="1360" width="840" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="1389" class="heading">Values and reference metadata</text>
<text x="146" y="1417" class="body">Finite numbers, ordered bounds, supplied units and interval context</text>
<text x="146" y="1442" class="body">Out-of-reference is descriptive; it is not automatically a data error</text>
<text x="146" y="1467" class="body">Evidence of clinical plausibility requires method/population review</text>
</g>
<g data-node="OUTPUT"><rect x="130" y="1555" width="840" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="1584" class="heading">Write separate checks, credibility and explicit readiness denominators</text>
<text x="146" y="1612" class="body">Priority: error → unclear → suggestion → passed</text>
<text x="146" y="1637" class="body">Readiness is a numeric semantic proxy, not MII certification or clinical approval</text>
</g>
<g data-node="REVIEW"><rect x="130" y="1720" width="840" height="82" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="1749" class="heading">Expert adjudication → approved site mapping → formal FHIR validation</text>
<text x="146" y="1777" class="body">Patient Observations are never generated from aggregate means</text>
</g>
