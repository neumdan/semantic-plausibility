<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc"><title id="title">Decision flow: validate, verify, research and review</title><desc id="desc">Local full FHIR validation, real terminology evidence and auditable clinician proposals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#537487"/></marker></defs><rect width="1200" height="100%" fill="#f4f7f9"/>
<path data-edge="INPUT-FHIR" d="M600.0 160 V180.0 H600.0 V200" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="FHIR-LOOKUP" d="M600.0 315 V335.0 H600.0 V355" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="LOOKUP-FIT" d="M600.0 475 V495.0 H600.0 V515" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="FIT-CONVERT" d="M600.0 640 V660.0 H215.0 V680" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="FIT-UNKNOWN" d="M600.0 640 V660.0 H600.0 V680" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="FIT-UNCHANGED" d="M600.0 640 V660.0 H985.0 V680" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="CONVERT-NUMERIC" d="M215.0 795 V817.5 H600.0 V840" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="UNKNOWN-NUMERIC" d="M600.0 795 V817.5 H600.0 V840" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="UNCHANGED-NUMERIC" d="M985.0 795 V817.5 H600.0 V840" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="NUMERIC-REPORT" d="M600.0 960 V980.0 H600.0 V1000" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="REPORT-REVIEW" d="M600.0 1120 V1140.0 H600.0 V1160" fill="none" stroke="#537487" stroke-width="2" marker-end="url(#arrow)"/>
<g data-node="INPUT"><rect x="340" y="50" width="520" height="110" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="356" y="79" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Input contract and selected guide</text>
<text x="356" y="103" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Verify source shape, versions, units, references and frequency</text>
<text x="356" y="124" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Preserve original source records and meaningful context</text>
</g>
<g data-node="FHIR"><rect x="340" y="200" width="520" height="115" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="356" y="229" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Actual FHIR resources supplied?</text>
<text x="356" y="253" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Yes: local Matchbox/HL7 or MII full guide validation</text>
<text x="356" y="274" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">No: CSV/DB set checks; no synthetic patient resources</text>
<text x="356" y="295" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Retain formal issues separately; missing coverage is incomplete</text>
</g>
<g data-node="LOOKUP"><rect x="340" y="355" width="520" height="120" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="356" y="384" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Look up declared code and unit systems</text>
<text x="356" y="408" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Configured primary APIs, actual local catalogues and labels</text>
<text x="356" y="429" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Retain editions and sources; supplements enrich names</text>
<text x="356" y="450" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Verified / invalid / unknown are distinct outcomes</text>
</g>
<g data-node="FIT"><rect x="340" y="515" width="520" height="125" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="356" y="544" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Assess the whole semantic set</text>
<text x="356" y="568" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Name, LOINC axes, unit dimension and specimen/method fit</text>
<text x="356" y="589" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">UCUM validity alone does not prove analyte compatibility</text>
<text x="356" y="610" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Known example units support proposals, not universal limits</text>
</g>
<g data-node="CONVERT"><rect x="40" y="680" width="350" height="115" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="56" y="709" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Supported transformation</text>
<text x="56" y="733" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Verified target unit and linear factor</text>
<text x="56" y="754" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Transform value and each bound independently</text>
<text x="56" y="775" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">A sourced spelling is still a review proposal</text>
</g>
<g data-node="UNKNOWN"><rect x="450" y="680" width="300" height="115" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="466" y="709" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Ambiguous or unsupported</text>
<text x="466" y="733" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Missing denominator or evidence</text>
<text x="466" y="754" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Retain error / unresolved finding</text>
<text x="466" y="775" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">No guessed correction or factor</text>
</g>
<g data-node="UNCHANGED"><rect x="810" y="680" width="350" height="115" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="826" y="709" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Documented unchanged fit</text>
<text x="826" y="733" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Keep supplied code/unit/value</text>
<text x="826" y="754" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Clinical applicability remains a review task</text>
<text x="826" y="775" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Continue numeric/reference checks</text>
</g>
<g data-node="NUMERIC"><rect x="340" y="840" width="520" height="120" rx="8" fill="#ffffff" stroke="#b7cec9"/><text x="356" y="869" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Check values and full reference sets</text>
<text x="356" y="893" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Finite numbers, ordered bounds and independently valid units</text>
<text x="356" y="914" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Out-of-reference is descriptive; preserve qualifiers</text>
<text x="356" y="935" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Evidence of reported practice requires contextual review</text>
</g>
<g data-node="REPORT"><rect x="340" y="1000" width="520" height="120" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="356" y="1029" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Write checks, recommendations and sources</text>
<text x="356" y="1053" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Optional Ollama research: real search, then bounded extraction</text>
<text x="356" y="1074" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Codes, names, units, intervals and their sources</text>
<text x="356" y="1095" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Formal FHIR state, credibility and readiness remain separate</text>
</g>
<g data-node="REVIEW"><rect x="340" y="1160" width="520" height="120" rx="8" fill="#eef7f4" stroke="#b7cec9"/><text x="356" y="1189" fill="#142d42" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Clinician adjudication and scoped reuse</text>
<text x="356" y="1213" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Record reviewer, time, evidence and explicit mapping decision</text>
<text x="356" y="1234" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Recheck approved targets/factors and every bound on reuse</text>
<text x="356" y="1255" fill="#142d42" font-family="system-ui,sans-serif" font-size="14">Apply approved mappings in ETL and validate actual FHIR</text>
</g>
</svg>
