<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1080" viewBox="0 0 1100 1080" role="img" aria-labelledby="title desc">
<title id="title">Input representations and domain data models</title><desc id="desc">CSV / LIS / CDS Hub DB; Complete FHIR documents; Explicit domain selection; Laboratory semantic set; Medication semantic set; Choose output representation; Domain checks → CSV + HTML with sources; Clinician review of the complete set</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="CSV"><rect x="20" y="20" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="49" class="heading">CSV / LIS / CDS Hub DB</text>
<text x="36" y="77" class="body" style="font-size:16px">Individual or distinct source rows</text>
<text x="36" y="102" class="body" style="font-size:16px">Column map + actual source counts</text>
<text x="36" y="127" class="body" style="font-size:16px">Read-only site-specific view</text>
</g>
<g data-node="FHIR"><rect x="385" y="20" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="401" y="49" class="heading">Complete FHIR documents</text>
<text x="401" y="77" class="body" style="font-size:16px">Bundle / array / NDJSON / JSON</text>
<text x="401" y="102" class="body" style="font-size:16px">or resource_json in a CSV cell</text>
<text x="401" y="127" class="body" style="font-size:16px">Resolve exported Medication locally</text>
</g>
<g data-node="CONFIG"><rect x="750" y="20" width="330" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="766" y="49" class="heading">Explicit domain selection</text>
<text x="766" y="77" class="body" style="font-size:16px">Observation / MedicationRequest</text>
<text x="766" y="102" class="body" style="font-size:16px">or MedicationAdministration</text>
<text x="766" y="127" class="body" style="font-size:16px">TOML profile, lookups and secrets</text>
</g>
<g data-node="LAB"><rect x="20" y="245" width="515" height="182" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="274" class="heading">Laboratory semantic set</text>
<text x="36" y="302" class="body">code + system/edition + analyte/name</text>
<text x="36" y="327" class="body">value or observed bounds + unit/system</text>
<text x="36" y="352" class="body">Every reference range and its qualifiers</text>
<text x="36" y="377" class="body">Specimen, method, comparator and modifiers</text>
</g>
<g data-node="MED"><rect x="565" y="245" width="515" height="182" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="581" y="274" class="heading">Medication semantic set</text>
<text x="581" y="302" class="body">Product + system/edition + form/ingredients</text>
<text x="581" y="327" class="body">Strength + all dose/unit, route and timing data</text>
<text x="581" y="352" class="body">Status/intent + actual duration + modifiers</text>
<text x="581" y="377" class="body">No averaging different doses or regimens</text>
</g>
<g data-node="GROUP"><rect x="130" y="515" width="840" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="544" class="heading">Choose output representation</text>
<text x="146" y="572" class="body">distinct: complete guarded sets + known counts; laboratory numeric distributions</text>
<text x="146" y="597" class="body">items: individual inputs with original resource/database ID and source locator</text>
<text x="146" y="622" class="body">Missing counts and unresolved references remain explicit; no missing context is invented</text>
</g>
<g data-node="CHECK"><rect x="130" y="710" width="840" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="739" class="heading">Domain checks → CSV + HTML with sources</text>
<text x="146" y="767" class="body">Lab: lookups, code–unit–range fit; optional local AI and literature evidence</text>
<text x="146" y="792" class="body">Medication: terminology + numeric/dimensional dose checks and conditional calculations</text>
</g>
<g data-node="REVIEW"><rect x="130" y="885" width="840" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="914" class="heading">Clinician review of the complete set</text>
<text x="146" y="942" class="body">Each source set → linked definitions → explanations, transformations and sources</text>
<text x="146" y="967" class="body">FHIR validation is separate and applies only to full resources; input stays unchanged</text>
<text x="146" y="992" class="body">Clinical dose safety and medication AI/evidence research are not implemented</text>
</g>
<path data-edge="CSV-LAB" d="M185 152 V242" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="CSV-MED" d="M185 152 V198 H730 V242" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FHIR-LAB" d="M550 152 V220 H450 V242" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FHIR-MED" d="M550 152 V220 H650 V242" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="CONFIG-MED" d="M915 152 V242" fill="none" stroke="#537487" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path data-edge="LAB-GROUP" d="M280 427 V470 H450 V512" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="MED-GROUP" d="M825 427 V470 H650 V512" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="GROUP-CHECK" d="M550 647 V707" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="CHECK-REVIEW" d="M550 816 V882" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
