<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Source exports → guarded aggregation → review artifacts</title><desc id="desc">LIS export; CDS Hub export; FHIR R4 export; Export contract; One selected semantic representation; Exact checks and optional evidence candidates; Local CSV report + HTML + summary + evidence + audit log</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#537487"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#142d42}.heading{font-size:19px;font-weight:700}.body{font-size:17px}.label{font-size:14px;fill:#526978}</style><rect width="1100" height="100%" fill="white"/>
<g data-node="LIS"><rect x="20" y="20" width="250" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="36" y="49" class="heading">LIS export</text>
<text x="36" y="77" class="body">CSV / approved DB view</text>
<text x="36" y="102" class="body">Vendor extraction upstream</text>
</g>
<g data-node="HUB"><rect x="290" y="20" width="250" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="306" y="49" class="heading">CDS Hub export</text>
<text x="306" y="77" class="body">Mapped scalar DB / CSV</text>
<text x="306" y="102" class="body">Read-only optional DB input</text>
</g>
<g data-node="FHIR"><rect x="560" y="20" width="250" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="576" y="49" class="heading">FHIR R4 export</text>
<text x="576" y="77" class="body">Bundle / NDJSON files</text>
<text x="576" y="102" class="body">TORCH / CQL upstream</text>
</g>
<g data-node="CSV"><rect x="830" y="20" width="250" height="106" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="846" y="49" class="heading">Export contract</text>
<text x="846" y="77" class="body">Individual or distinct</text>
<text x="846" y="102" class="body">Real count only if known</text>
</g>
<g data-node="GROUP"><rect x="130" y="225" width="840" height="132" rx="9" fill="#f3f7fa" stroke="#c4d5df"/>
<text x="146" y="254" class="heading">One selected semantic representation</text>
<text x="146" y="282" class="body">code + code_system + value/bounds + unit + unit_system + full reference set</text>
<text x="146" y="307" class="body">DuckDB: distinct guarded sets; optional items with ID/path</text>
<text x="146" y="332" class="body">Keep status, versions, comparator, specimen/method and interval qualifiers</text>
</g>
<g data-node="CHECK"><rect x="130" y="425" width="840" height="106" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="454" class="heading">Exact checks and optional evidence candidates</text>
<text x="146" y="482" class="body">Local pack / configured terminology → code-unit fit → numbers/reference consistency</text>
<text x="146" y="507" class="body">Reviewable coding/quantity proposals with independently supported transformations</text>
</g>
<g data-node="OUT"><rect x="130" y="595" width="840" height="132" rx="9" fill="#eef7f4" stroke="#a8cfc6"/>
<text x="146" y="624" class="heading">Local CSV report + HTML + summary + evidence + audit log</text>
<text x="146" y="652" class="body">Original sets + eligible distributions + separate checks + readiness ratio</text>
<text x="146" y="677" class="body">Compare matched LIS / FHIR / CDS Hub exports; physician review before mapping</text>
<text x="146" y="702" class="body">No upload, message interception or aggregate-to-patient resource generation</text>
</g>
<path data-edge="LIS-GROUP" d="M145 126 V180 H550 V222" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="HUB-GROUP" d="M415 126 V180 H550 V222" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="FHIR-GROUP" d="M685 126 V180 H550 V222" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="CSV-GROUP" d="M955 126 V180 H550 V222" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="GROUP-CHECK" d="M550 357 V422" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
<path data-edge="CHECK-OUT" d="M550 531 V592" fill="none" stroke="#537487" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
