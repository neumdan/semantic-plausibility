config_version=3
[general]
PROJECT_NAME="laboratory-study-example"
RESOURCE_TYPE="Observation"
[input]
type="csv"
origin="lis"
source_namespace="example-site"
path="../laboratory.csv"
granularity="distinct"
[input.columns]
code="code"
code_system="code_system"
value="value"
unit="unit"
unit_code="unit_code"
unit_system="unit_system"
count="count"
reference_ranges_json="reference_ranges_json"
specimen="specimen"
source_test="source_test"
status="status"
[specification]
FHIR_VERSION="4.0.1"
PROFILE="fhir-r4-lab"
STRUCTURE_DEFINITION="../profiles/ObservationLab-2026.0.3.json"
VALUE_SETS=["../profiles/results-laboratory-observations-uv-ips.json"]
IG_PACKAGE="de.medizininformatikinitiative.kerndatensatz.laborbefund"
IG_VERSION="2026.0.3"
IG_CANONICAL="https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab"
[aggregation]
engine="duckdb"
group_by=["code","code_system","unit","unit_system","reference_range"]
[network]
mode="lookups"
[study]
cohort="example-cohort-v1"
period_start="2026-01-01"
period_end="2026-01-31"
source_label="lis"
[output]
mode="distinct"
path="../../output/mii-lis.review.csv"
include_evidence=true
include_distribution=true

[lookups.ucum]
enabled = true
type = "ucum"
endpoint = "https://ucum.nlm.nih.gov/ucum-service/v1"

[lookups.loinc]
enabled = true
type = "loinc"
endpoint = "https://tx.fhir.org/r4"
