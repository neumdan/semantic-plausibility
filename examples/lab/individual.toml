# Synthetic laboratory input. Real APIs. Relative paths start at this TOML.
config_version = 3
[general]
RESOURCE_TYPE = "Observation"
[input]
type = "csv"
path = "individual.csv"
origin = "lis"
source_namespace = "synthetic-lab-summary"
granularity = "individual"
[input.columns]
code = "code"
analyte_name = "name"
code_system = "code_system"
unit = "unit"
unit_code = "unit_code"
unit_system = "unit_system"
id = "id"
value = "value"
range_low = "reference_low"
range_high = "reference_high"
specimen = "specimen"
status = "status"
[specification]
FHIR_VERSION = "4.0.1"
PROFILE = "mii-kds-lab"
STRUCTURE_DEFINITION = "../profiles/ObservationLab-2026.0.3.json"
VALUE_SETS = ["../profiles/results-laboratory-observations-uv-ips.json"]
IG_PACKAGE = "de.medizininformatikinitiative.kerndatensatz.laborbefund"
IG_VERSION = "2026.0.3"
IG_CANONICAL = "https://www.medizininformatik-initiative.de/fhir/core/modul-labor/StructureDefinition/ObservationLab"
[network]
mode = "lookups"
allowed_http_hosts = ["ollama"] # Local Compose inference; public lookups require HTTPS.
[lookups.ucum]
enabled = true
role = "primary"
type = "ucum"
endpoint = "https://ucum.nlm.nih.gov/ucum-service/v1"
[lookups.loinc]
enabled = true
role = "primary"
type = "loinc"
endpoint = "https://tx.fhir.org/r4"
[output]
mode = "distinct"
path = "../../output/lab-individual.csv"
[models.local]
runtime = "ollama"
base_url = "http://127.0.0.1:11434/v1"
container_base_url = "http://ollama:11434/v1"
model = "ministral-3:3b"
temperature = 0
max_tokens = 2048
timeout_seconds = 600
response_mode = "json_schema"
[research]
enabled = false
scope = "studies"
sources = ["europe_pmc", "pubmed"]
max_articles_per_loinc = 4
unit_catalog = "../../local/unit-catalog.json"
[research.europe_pmc]
BASE_URL = "https://www.ebi.ac.uk/europepmc/webservices/rest"
MAX_RESULTS = 2
QUERY_FILTER = '(human OR humans OR patients OR volunteers OR healthy OR population) NOT (feline OR cats OR canine OR dogs OR cattle OR rats OR mice OR veterinary)'
[research.pubmed]
BASE_URL = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
MAX_RESULTS = 1
[validation]
enabled = false # Summary rows are not full FHIR resources.
