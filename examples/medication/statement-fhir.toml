# Run in place: run-plausibility-check --config examples/medication/statement-fhir.toml
# Synthetic source inputs; all lookup responses come from actual configured services.
config_version = 3
[general]
PROJECT_NAME = "medication-statement-review"
RESOURCE_TYPE = "MedicationStatement"
[input]
type = "fhir_file"
origin = "fhir"
path = "statement-bundle.json"
granularity = "individual"
[specification]
FHIR_VERSION = "4.0.1"
IG_PACKAGE = "de.medizininformatikinitiative.kerndatensatz.medikation"
IG_VERSION = "2026.0.1"
IG_CANONICAL = "https://www.medizininformatik-initiative.de/fhir/core/modul-medikation/StructureDefinition/MedicationStatement"
[specification.links]
resource = "https://hl7.org/fhir/R4/medicationstatement.html"
guide = "https://www.medizininformatik-initiative.de/Kerndatensatz/KDS_Medikation_2026/MIIIGModulMedikation.html"
source = "https://github.com/medizininformatik-initiative/kerndatensatzmodul-medikation"
[network]
mode = "lookups" # Use "offline" with installed real catalogues; missing evidence remains unknown.
[lookups.ucum]
enabled = true
type = "ucum"
role = "primary"
endpoint = "https://ucum.nlm.nih.gov/ucum-service/v1"
[lookups.medication_codes]
enabled = true
type = "fhir"
role = "primary"
endpoint = "https://tx.fhir.org/r4" # Public test service; coverage/availability are recorded, never presumed.
systems = ["http://www.whocc.no/atc", "http://snomed.info/sct", "http://www.nlm.nih.gov/research/umls/rxnorm", "http://fdasis.nlm.nih.gov", "http://standardterms.edqm.eu", "http://fhir.de/CodeSystem/bfarm/atc", "http://fhir.de/CodeSystem/ifa/pzn", "http://fhir.de/CodeSystem/ask", "http://terminology.hl7.org/CodeSystem/CAS"]
# For your authenticated server, change endpoint and uncomment:
# token_env = "MEDICATION_TX_TOKEN" # Put the value in .env, never in TOML/Git.
# For MII SU-TermServ instead: see ../../docs/lookups.md#mii-client-certificates.
[lookups.downloads]
enabled = false
type = "fhir_artifacts"
role = "source"
path = "../../local/terminologies/atc-2026" # Real BfArM/other licensed artifacts.
systems = ["http://fhir.de/CodeSystem/bfarm/atc"]
[output]
mode = "distinct" # Use "items" only with individual input; IDs are then retained.
path = "../../output/medication-statement-fhir.csv"
[validation]
setup_directory = "../../local/validation" # Generated Compose validator files, relative to this TOML.
enabled = true # Complete synthetic resources; MII errors are expected where required data is absent.
backend = "matchbox"
endpoint = "http://127.0.0.1:8081/matchboxv3/fhir"
container_endpoint = "http://matchbox:8080/matchboxv3/fhir"
terminology_server = "http://blaze:8080/fhir"
terminology_endpoint = "http://127.0.0.1:8082/fhir"
fail_on_error = true
