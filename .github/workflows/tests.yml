name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-editable --extra postgres --group dev
      - run: uv run --no-sync ruff check src tests tools
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync plausibility config-check --config pipeline.example.toml --out output/config-check.json
      - run: uv run --no-sync plausibility batch --config pipeline.example.toml
      - run: uv run --no-sync plausibility verify output/laboratory-export-review.audit.jsonl
      - run: uv run --no-sync python tools/run_study_demo.py --out output/study-demo
      - run: uv build --wheel
      - run: uv run --no-sync python tools/build_release.py
