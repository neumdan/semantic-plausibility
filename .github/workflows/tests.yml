name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-editable --extra postgres --group dev
      - run: uv run --no-sync ruff check src tests tools run-plausibility-check.py
      - run: uv run --no-sync run-plausibility-check profile-init --config pipeline.example.toml
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          SQC_LIVE_TESTS: "1"
      - run: uv run --no-sync run-plausibility-check config-check --config tests/configurations/lab/aggregated.toml --out output/config-check.json
      - run: uv run --no-sync run-plausibility-check --config tests/configurations/lab/aggregated.toml
      - run: uv run --no-sync run-plausibility-check verify output/lab-summary.audit.jsonl
      - run: uv build --wheel
      - run: uv run --no-sync python tools/build_release.py
